<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Served from a <meta> tag because the server sets no security headers.
      Moving this to a real response header (and adding frame-ancestors, which
      <meta> ignores) would be strictly better.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self' https://fonts.googleapis.com;
               font-src https://fonts.gstatic.com;
               img-src 'self' data:;
               connect-src 'self';
               base-uri 'none';
               form-action 'none'"
    />
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="A daily guessing game for characters of Brandon Sanderson's Cosmere."
    />
    <title>Cosmeredle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <script type="module" src="/static/main.js"></script>
  </head>

  <body>
    <div class="mist-layer" aria-hidden="true">
      <div class="mist"></div>
      <div class="mist"></div>
    </div>

    <header class="shell site-header">
      <h1 class="site-title">Cosmeredle</h1>

      <div class="site-header__auth">
        <div id="auth-signed-out" class="auth-actions">
          <button id="login-button" type="button" class="btn btn--secondary">
            Log In
          </button>
          <button id="signup-button" type="button" class="btn btn--primary">
            Sign Up
          </button>
        </div>

        <div id="auth-signed-in" class="auth-status" hidden>
          <span id="auth-username-display" class="auth-status__name"></span>
          <button id="logout-button" type="button" class="btn btn--link">
            Log Out
          </button>
        </div>
      </div>
    </header>

    <dialog id="auth-dialog" class="dialog" aria-labelledby="auth-title">
      <button
        id="auth-close"
        type="button"
        class="btn--icon dialog__close"
        aria-label="Close"
      >
        &times;
      </button>

      <h2 id="auth-title" class="dialog__title">Log In</h2>

      <form id="auth-form" class="dialog__form">
        <div class="field">
          <label class="field__label" for="auth-username">Username</label>
          <input
            id="auth-username"
            class="input"
            type="text"
            name="username"
            autocomplete="username"
            required
          />
        </div>

        <div class="field">
          <label class="field__label" for="auth-password">Password</label>
          <input
            id="auth-password"
            class="input"
            type="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>

        <button id="auth-submit" type="submit" class="btn btn--primary">
          Log In
        </button>
      </form>
    </dialog>

    <main class="shell site-main">
      <noscript>
        <p>Cosmeredle needs JavaScript enabled to play.</p>
      </noscript>

      <form id="guess-form" class="guess-form">
        <label class="visually-hidden" for="guess-input">Character name</label>
        <input
          id="guess-input"
          class="input guess-form__input"
          type="text"
          placeholder="Enter character name..."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          role="combobox"
          aria-expanded="false"
          aria-controls="character-options"
          aria-autocomplete="list"
          required
          autofocus
        />
        <button id="guess-submit" type="submit" class="btn btn--primary guess-form__submit">
          Guess
        </button>

        <ul
          id="character-options"
          class="combobox-list"
          role="listbox"
          aria-label="Character suggestions"
          hidden
        ></ul>
      </form>

      <div id="win-banner" class="banner" role="status" hidden>
        <h2 class="banner__title display">Solved</h2>
        <p id="win-banner-detail" class="banner__detail"></p>
      </div>

      <section class="board">
        <!-- A real table: the heading row supplies each column's name, and on
             narrow screens, where it is hidden, every cell carries its own. -->
        <div class="board__table" role="table" aria-label="Your guesses">
          <div id="board-head" class="board__row board__head" role="row"></div>
          <div id="board" role="rowgroup"></div>
        </div>

        <!-- Rows are inserted without moving focus, so the graded guess is
             also announced here. -->
        <p id="board-status" class="visually-hidden" role="status"></p>
      </section>

      <section class="legend" aria-labelledby="legend-title">
        <h2 id="legend-title" class="legend__title">Legend</h2>
        <ul id="legend-items" class="legend__items"></ul>
      </section>
    </main>

    <div class="toast-region">
      <div id="toast-assertive" class="toast-region__live" aria-live="assertive"></div>
      <div id="toast-polite" class="toast-region__live" aria-live="polite"></div>
    </div>
  </body>
</html>
