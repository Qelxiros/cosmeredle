[package]
name = "cosmeredle"
version = "0.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chrono = "0.4.45"
ciborium = "0.2.2"
ctrlc = "3.5.2"
futures = "0.3.34"
itertools = "0.15.0"
mediawiki = "0.5.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_ron = "1.0.0"
sha3 = "0.12.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tokio-cron-scheduler = "0.15.1"
tower-http = { version = "0.7.1", features = ["compression-gzip", "limit"] }
uuid = "1.26.1"
