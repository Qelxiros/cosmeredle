[package]
name = "cosmeredle"
version = "0.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chrono = "0.4.45"
ciborium = "0.2.2"
dotenvy = "0.15.7"
itertools = "0.15.0"
mediawiki = "0.5.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha3 = "0.12.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
